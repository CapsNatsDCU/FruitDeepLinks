# Opt-in for Fruit's dual-stack Docker bridge (glibc Debian image).
# Give the bridge's ULA source the same label as public IPv6 destinations.
# Keep the other default labels. IPv4 remains available when IPv6 is absent.
label ::1/128 0
label ::/0 1
label 2002::/16 2
label ::/96 3
label ::ffff:0:0/96 4
label fec0::/10 5
label fc00::/7 1
label 2001:0::/32 7
